<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Unit Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            color: #222;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Unit Converter</h2>

    <input type="number" id="value" placeholder="Enter value">

    <select id="fromUnit">
        <option value="m">Meter (m)</option>
        <option value="km">Kilometer (km)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="inch">Inch</option>
        <option value="ft">Foot (ft)</option>
    </select>

    <select id="toUnit">
        <option value="m">Meter (m)</option>
        <option value="km">Kilometer (km)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="inch">Inch</option>
        <option value="ft">Foot (ft)</option>
    </select>

    <button onclick="convert()">Convert</button>

    <div id="result">Result: --</div>
</div>

<script>
function toMeter(value, unit) {
    switch(unit) {
        case "km":
            return value * 1000;
        case "cm":
            return value / 100;
        case "inch":
            return value * 0.0254;
        case "ft":
            return value * 0.3048;
        default:
            return value;
    }
}

function fromMeter(value, unit) {
    switch(unit) {
        case "km":
            return value / 1000;
        case "cm":
            return value * 100;
        case "inch":
            return value / 0.0254;
        case "ft":
            return value / 0.3048;
        default:
            return value;
    }
}

function convert() {

    let value = parseFloat(document.getElementById("value").value);
    let from = document.getElementById("fromUnit").value;
    let to = document.getElementById("toUnit").value;

    if (isNaN(value)) {
        document.getElementById("result").innerHTML = "Please enter a number!";
        return;
    }

    let meters = toMeter(value, from);
    let result = fromMeter(meters, to);

    document.getElementById("result").innerHTML =
        "Result: " + result.toFixed(2) + " " + to;
}
</script>

</body>
</html>
