<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            color: #222;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Unit Converter</h2>

    <input type="number" id="value" placeholder="Enter value">

    <select id="fromUnit">
        <option value="m">Meter (m)</option>
        <option value="km">Kilometer (km)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="inch">Inch</option>
        <option value="ft">Foot (ft)</option>
    </select>

    <select id="toUnit">
        <option value="km">Kilometer (km)</option>
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="inch">Inch</option>
        <option value="ft">Foot (ft)</option>
    </select>

    <button onclick="convert()">Convert</button>

    <div id="result">Result: --</div>

</div>

<script>
function convert() {

    let value = parseFloat(document.getElementById("value").value);
    let fromUnit = document.getElementById("fromUnit").value;
    let toUnit = document.getElementById("toUnit").value;

    if (isNaN(value)) {
        document.getElementById("result").innerHTML =
            "Please enter a value";
        return;
    }

    // Convert the input value to meters
    let meters;

    if (fromUnit === "m") {
        meters = value;
    }
    else if (fromUnit === "km") {
        meters = value * 1000;
    }
    else if (fromUnit === "cm") {
        meters = value / 100;
    }
    else if (fromUnit === "inch") {
        meters = value * 0.0254;
    }
    else if (fromUnit === "ft") {
        meters = value * 0.3048;
    }

    // Convert meters to the selected unit
    let result;

    if (toUnit === "m") {
        result = meters;
    }
    else if (toUnit === "km") {
        result = meters / 1000;
    }
    else if (toUnit === "cm") {
        result = meters * 100;
    }
    else if (toUnit === "inch") {
        result = meters / 0.0254;
    }
    else if (toUnit === "ft") {
        result = meters / 0.3048;
    }

    document.getElementById("result").innerHTML =
        "Result: " + result;
}
</script>

</body>
</html>
